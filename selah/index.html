<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selah — Read deeply. Live faithfully.</title>
<meta name="description" content="A guided Bible study that teaches you how to read Scripture for yourself.">
<style>
:root{--ink:#17231e;--muted:#66736d;--paper:#f7f5ef;--card:#fffdf8;--line:#dedbd0;--green:#174d3d;--green2:#286b54;--gold:#b58a3a;--soft:#e7efe9;--shadow:0 18px 50px #13281b12}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 Inter,system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#f7f5eff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{max-width:1180px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--green);text-decoration:none}.mark{width:34px;height:34px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font:20px Georgia}.links{margin-left:auto;display:flex;gap:4px}.links button,.ghost{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px}.links button.active,.links button:hover{background:#e9eee9;color:var(--green);font-weight:700}
main{max-width:1180px;margin:auto;padding:40px 22px 80px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:26px;margin:18px 0 34px}.heroCard{background:var(--green);color:white;border-radius:28px;padding:38px;box-shadow:var(--shadow);overflow:hidden}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--gold)}h1,h2,h3{font-family:Georgia,serif;line-height:1.15;margin:0 0 12px}h1{font-size:clamp(38px,5vw,64px);letter-spacing:-.04em}.hero p{color:#d8e4de;font-size:17px;max-width:650px}.btn{border:1px solid transparent;border-radius:12px;padding:11px 15px;font-weight:750;background:var(--green);color:white}.btn.light{background:white;color:var(--green)}.btn.outline{background:transparent;border-color:var(--line);color:var(--ink)}.btn.gold{background:var(--gold)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.quote{background:#efeadd;border-radius:28px;padding:30px;display:flex;flex-direction:column;justify-content:center}.quote blockquote{font:italic 22px/1.45 Georgia;margin:0 0 12px}.muted{color:var(--muted)}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--green);font-size:12px;font-weight:800}
.section{margin-top:34px}.sectionHead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:15px}.sectionHead h2{font-size:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 5px 20px #13281b06}.card h3{font-size:22px}
.studyLayout{display:grid;grid-template-columns:260px 1fr;gap:18px}.steps{position:sticky;top:78px;align-self:start}.step{display:flex;gap:12px;padding:13px;border-radius:14px;margin-bottom:6px;color:var(--muted);cursor:pointer}.step b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#ebe9e0;font-size:12px}.step.active{background:#e6eee8;color:var(--green);font-weight:800}.step.active b{background:var(--green);color:white}.passage{background:white;border:1px solid var(--line);border-radius:22px;padding:28px}.passageMeta{display:flex;justify-content:space-between;gap:10px}.verse{font:19px/1.8 Georgia;margin:20px 0}.verse sup{font:11px;font-family:system-ui;color:var(--gold);font-weight:800;margin-right:5px}.coach{background:#f0f4f0;border-left:4px solid var(--green2);padding:16px 18px;border-radius:0 14px 14px 0}.question{margin-top:22px}.question label{display:block;font-weight:800;margin-bottom:7px}.question textarea{width:100%;min-height:125px;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fffdf8;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{border:1px solid var(--line);background:white;padding:8px 10px;border-radius:999px;color:var(--muted)}.chip.selected{background:#e3eee8;color:var(--green);font-weight:700}
.bookGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.book{padding:20px;border:1px solid var(--line);border-radius:17px;background:white;cursor:pointer}.book:hover{box-shadow:var(--shadow)}.book strong{display:block;font:20px Georgia;margin:4px 0}.review{display:grid;grid-template-columns:1fr 1fr;gap:18px}.flash{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.flash h3{font-size:28px;max-width:600px}.answer{margin-top:15px;padding:15px;background:#f0f3ed;border-radius:14px}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:white;padding:12px 15px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}footer{max-width:1180px;margin:auto;padding:25px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media(max-width:850px){.hero,.review,.studyLayout{grid-template-columns:1fr}.steps{position:static;display:flex;overflow:auto}.step{min-width:145px}.grid{grid-template-columns:1fr 1fr}.bookGrid{grid-template-columns:1fr 1fr}.links button{display:none}.links button.active{display:block}}
@media(max-width:560px){main{padding:24px 15px 60px}.heroCard,.quote{padding:25px}.grid,.bookGrid{grid-template-columns:1fr}.passage{padding:20px}}

.bibleShell{display:grid;grid-template-columns:280px 1fr;gap:18px}.bibleSide{position:sticky;top:78px;align-self:start}.biblePanel{background:white;border:1px solid var(--line);border-radius:20px;padding:18px}.testament{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--gold);margin:8px 0}.bookList{display:grid;gap:4px;max-height:calc(100vh - 210px);overflow:auto}.bookBtn{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;color:var(--muted)}.bookBtn:hover,.bookBtn.active{background:#e7efe9;color:var(--green);font-weight:800}.bibleMain{min-width:0}.bibleToolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.searchBox{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:white}.chapterNav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 20px}.chapterBtn{min-width:40px;border:1px solid var(--line);background:white;padding:8px 10px;border-radius:9px}.chapterBtn.active{background:var(--green);color:white;border-color:var(--green)}.reader{background:#fffdf8;border:1px solid var(--line);border-radius:22px;padding:34px 42px}.readerHead{display:flex;justify-content:space-between;gap:16px;align-items:start}.reader h1{font-size:42px}.readerText{font:20px/1.9 Georgia,serif;max-width:760px;margin:28px auto 0}.readerVerse{display:block;padding:4px 7px;border-radius:7px}.readerVerse:hover{background:#f0f4ed}.readerVerse sup{font:11px/1 system-ui;color:var(--gold);font-weight:800;margin-right:7px}.searchResults{display:grid;gap:10px;margin-top:15px}.result{padding:15px;border:1px solid var(--line);border-radius:14px;background:white;cursor:pointer}.result:hover{border-color:var(--green2);box-shadow:var(--shadow)}.resultRef{font-size:12px;font-weight:800;color:var(--green);margin-bottom:3px}.resultText{font-family:Georgia,serif}.loading{padding:24px;text-align:center;color:var(--muted)}

.selectionBar{position:sticky;bottom:18px;margin:18px auto 0;max-width:820px;background:var(--green);color:white;border-radius:16px;padding:12px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:10}.selectionBar span{flex:1}.selectionCount{font-weight:800}.readerVerse.selected{background:#e3eee8;outline:1px solid #b9d2c3}.readerVerse.note{box-shadow:inset 3px 0 var(--gold)}.verseTools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.miniBtn{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 11px;color:var(--muted)}.miniBtn:hover{color:var(--green);border-color:var(--green2)}.contextGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.contextCard{padding:14px;background:#f0f4f0;border-radius:13px}.contextCard strong{display:block;color:var(--green);margin-bottom:3px}.noteBox{margin-top:14px}.noteBox textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffdf8}.studyPrompt{margin-top:16px;padding:17px;border:1px solid #cbd9cf;background:#f5f8f4;border-radius:14px}.studyPrompt h3{font-size:19px}.studyPrompt p{margin-bottom:0}.selectionHint{font-size:13px;color:var(--muted);margin-top:10px}
@media(max-width:850px){.contextGrid{grid-template-columns:1fr}.selectionBar{bottom:8px}.bibleShell{grid-template-columns:1fr}.bibleSide{position:static}}
 .authOverlay{position:fixed;inset:0;background:#17231e88;display:grid;place-items:center;padding:20px;z-index:100}.authCard{position:relative;width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow);display:grid;gap:12px}.authCard h2{font-size:30px}.authClose{position:absolute;right:15px;top:10px;border:0;background:transparent;font-size:28px;color:var(--muted)} .authCard .searchBox{width:100%} .authCard .btn{margin-top:4px}.hidden{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="selah-build" content="2026-10-02-stable-js">
</head>
<body>
<header class="top"><nav class="nav"><a class="brand" href="#/" onclick="route('home')"><span class="mark">S</span> Selah</a><div class="links"><button id="n-account" class="ghost" onclick="openAuth()">Sign in</button><button id="n-home" onclick="route('home')">Today</button><button id="n-study" onclick="route('study')">Study</button><button id="n-library" onclick="route('library')">Library</button><button id="n-bible" onclick="route('bible')">Bible</button><button id="n-review" onclick="route('review')">Review</button></div></nav></header>
<main id="app"></main><div id="authModal" class="authOverlay hidden"><div class="authCard"><button class="authClose" onclick="closeAuth()">×</button><div class="eyebrow">Your Selah account</div><h2 id="authTitle">Sign in</h2><p class="muted" id="authMessage">Save your studies, notes and progress across devices.</p><input id="authName" class="searchBox hidden" placeholder="Display name"><input id="authEmail" class="searchBox" type="email" placeholder="Email address"><input id="authPassword" class="searchBox" type="password" placeholder="Password"><button class="btn" id="authSubmit" onclick="submitAuth()">Sign in</button><button class="miniBtn" id="authToggle" onclick="toggleAuthMode()">Create an account</button><button class="miniBtn" id="authReset" onclick="resetPassword()">Forgot password?</button></div></div><footer>Selah teaches a repeatable way to read Scripture: observe, contextualise, interpret, connect, respond, remember. <span id="stats"></span></footer><div id="toast" class="toast"></div>
<script src="./app.js"></script><script src="./boot-check.js"></script>
</body></html>

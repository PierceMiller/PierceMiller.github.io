 <linearGradient id="far" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7199a4"/><stop offset="1" stop-color="#567884"/></linearGradient>
 <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#789a91"/><stop offset="1" stop-color="#4f716b"/></linearGradient>
 <linearGradient id="valley" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#879c76"/><stop offset="1" stop-color="#365b50"/></linearGradient>
